{% extends "base.html" %}
{% block title %}Log in - JobPilot{% endblock %}
{% block content %}
<div style="max-width:420px; margin:8vh auto"><div class="page-header"><div><p class="eyebrow">Secure workspace</p><h1>Welcome back</h1><p class="lead">Enter the code from your authenticator app.</p></div></div>
<form method="post" action="/login" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="code">Code from your authenticator app</label>
  <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" autofocus>
  {% if error %}<p class="bad">{{ error }}</p>{% endif %}
  <p><button class="primary">Log in</button></p>
</form>
</div>
{% endblock %}
