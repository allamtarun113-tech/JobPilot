; One image, three processes. supervisord restarts any that exit, so one stalling or crashing
; doesn't freeze the others. Run: supervisord -n -c deploy/supervisor.conf
[supervisord]
nodaemon=true
logfile=%(here)s/../var/supervisord.log
pidfile=%(here)s/../var/supervisord.pid

[unix_http_server]
file=%(here)s/../var/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../var/supervisor.sock

[program:http]
command=%(here)s/../.venv/bin/python -m jobpilot.web.main
directory=%(here)s/..
autorestart=true
stopasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../var/http.log

[program:worker]
command=%(here)s/../.venv/bin/python -m jobpilot.worker.main
directory=%(here)s/..
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../var/worker.log

[program:dispatcher]
command=%(here)s/../.venv/bin/python -m jobpilot.dispatcher.main
directory=%(here)s/..
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../var/dispatcher.log
