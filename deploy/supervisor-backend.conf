; Laptop backend: worker + dispatcher only (the dashboard runs on Vercel).
; Run: supervisord -n -c deploy/supervisor-backend.conf   (or: make backend)
[supervisord]
nodaemon=true
logfile=%(here)s/../var/supervisord-backend.log
pidfile=%(here)s/../var/supervisord-backend.pid

[unix_http_server]
file=%(here)s/../var/supervisor-backend.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../var/supervisor-backend.sock

[program:worker]
command=%(here)s/../.venv/bin/python -m jobpilot.worker.main
directory=%(here)s/..
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../var/worker.log

[program:dispatcher]
command=%(here)s/../.venv/bin/python -m jobpilot.dispatcher.main
directory=%(here)s/..
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../var/dispatcher.log
